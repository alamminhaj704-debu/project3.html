<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job application</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
     <div class="apply_box">
        <h1>
        job application 
        <span class="title|_small"
        > ( web) </span>
        </h1>
        <form action="">
            <div class="form_container">
                <div class="form_control">
                  <lable for="first_name"> firstname </lable>  
                  <input id="first_name" name="first_name" placeholder="enter first name" />
                  
                   <div class="form_control">
                  <lable for="last_name"> lastname </lable>  
                  <input
                  id="last_name" name="last_name" placeholder="enter last name">
                    
                </div>
                 <div class="form_control">
                  <lable for="email"> email </lable>  
                  <input
                  type="email"
                   id="email" name="email" placeholder="enter your email">
                    
                </div>
                <div class="form_control">
                  <lable for="job role"> job role </lable>  
                 <select>
                    <option value=""> select job</option>
                     <option value="frontend">frontend developer</option>
                      <option value="backend">backend developer</option>
                       <option value="full_stack">full stack developer</option>
                        <option value="Ui_Ux">UI Ux designer</option>
                 </select>
                </div>
                <div class="form_control">
                    <lable for="address"> address</lable>
                    <textarea id="address " name="address " row="4" cols="50" placeholder="enter address"></textarea>
                </div>
                <div  class="form_control">
                    <lable for="city"></lable>
                    <input id="city" name="city" placeholder="enter your city......"/>
                </div>
                <div class="form_control">
                    <lable for="pincode"> pincode</lable>
                    <input 
                    type="number"
                    id="pincode" name="pincode" placeholder="enter your pincode" />
                </div>
                  <div class="form_control">
                    <lable for="date"> pincode</lable>
                    <input 
                    type="date"
                    id="date" name="date"  />
                </div>
                <div class="form_control">
                    <label for="upload"> upload you cv </label>
                    <input type="file" id="upload" name="upload" />

                </div>
            <div class="button_container">
                <button type="submit"> apply now</button>
            </div>    
              
            
        </form>
     </div>  
     
    </div>
</body>
</html>
